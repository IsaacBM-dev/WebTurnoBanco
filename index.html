<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Turnos - Banco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🏦 Control de Turnos en Banco</h1>

    <div class="card">
        <h2 id="tituloFormulario">Registrar Nuevo Turno</h2>
        <form id="formTurno">
            <input type="hidden" id="turnoId">

            <div class="form-group">
                <label>Código de Turno:</label>
                <input type="text" id="codigo" placeholder="Ej. A-01" required>
            </div>
            <div class="form-group">
                <label>Nombre del Cliente:</label>
                <input type="text" id="cliente" placeholder="Ej. Isaac BM" required>
            </div>
            <div class="form-group">
                <label>Tipo de Operación:</label>
                <select id="tipoOperacion" required>
                    <option value="Ventanilla">Ventanilla</option>
                    <option value="Plataforma">Plataforma</option>
                    <option value="Atención Preferencial">Atención Preferencial</option>
                </select>
            </div>
            <div class="form-group">
                <label>Estado del Turno:</label>
                <select id="estado" required>
                    <option value="En espera">En espera</option>
                    <option value="En atención">En atención</option>
                    <option value="Atendido">Atendido</option>
                </select>
            </div>

            <div class="form-botones">
                <button type="submit" id="btnGuardar">Guardar Turno</button>
                <button type="button" id="btnCancelar" class="btn-secundario" style="display: none;" onclick="cancelarEdicion()">Cancelar</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Turnos Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>Operación</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaTurnos">
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
